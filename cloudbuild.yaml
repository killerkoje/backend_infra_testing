steps:
  - name: node:22-alpine
    id: test
    entrypoint: node
    args: ['--test', 'demo/server.test.mjs']

  - name: docker
    args:
      - buildx
      - create
      - --driver
      - docker-container
      - --name
      - multiarch

  - name: docker
    args:
      - buildx
      - build
      - --builder
      - multiarch
      - --platform
      - linux/amd64,linux/arm64
      - --push
      - -t
      - asia-northeast3-docker.pkg.dev/mineral-brand-515105-e3/backend-images/backend-infra-testing:$SHORT_SHA
      - ./demo

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - hello
      - --image=asia-northeast3-docker.pkg.dev/mineral-brand-515105-e3/backend-images/backend-infra-testing:$SHORT_SHA
      - --region=asia-northeast3
      - --project=mineral-brand-515105-e3
      - --no-traffic
      - --tag=smoke-$SHORT_SHA
      - --quiet

  - name: node:22-alpine
    id: check-id-token
    env:
      - SMOKE_TAG=smoke-$SHORT_SHA
    entrypoint: node
    args:
      - --input-type=module
      - -e
      - |
        const host = 'metadata';
        let path = '/computeMetadata/v1';
        path += '/instance/service-accounts';
        path += '/default/identity';
        const url = new URL('http://' + host + path);
        let aud = 'https://hello-2czua56gca-';
        aud += 'du.a.run.app';
        url.searchParams.set('audience', aud);
        const headers = {
          'Metadata-Flavor': 'Google',
        };
        const res = await fetch(url, { headers });
        if (!res.ok) {
          throw Error('Token HTTP ' + res.status);
        }
        const token = await res.text();
        if (!token.trim()) throw Error('No token');
        console.log('ID token OK');

        const tag = process.env.SMOKE_TAG;
        if (!tag || !/^smoke-[a-f0-9]+$/.test(tag)) {
          throw Error('Invalid smoke test tag');
        }
        const target = new URL(aud);
        target.hostname = tag + '---' + target.hostname;
        const check = await fetch(target, {
          headers: { Authorization: 'Bearer ' + token.trim() },
          redirect: 'error',
          signal: AbortSignal.timeout(30_000),
        });
        console.log('Smoke HTTP ' + check.status);
        if (check.status !== 200) {
          throw Error('Smoke test failed');
        }

options:
  logging: CLOUD_LOGGING_ONLY
