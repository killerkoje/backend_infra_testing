steps:
  - name: node:22-alpine
    entrypoint: npm
    args: ["ci"]

  - name: node:22-alpine
    entrypoint: npm
    args: ["run", "build"]

  - name: docker
    args:
      - buildx
      - create
      - --driver
      - docker-container
      - --name
      - multiarch

  - name: docker
    args:
      - buildx
      - build
      - --builder
      - multiarch
      - --platform
      - linux/amd64,linux/arm64
      - --push
      - -t
      - asia-northeast3-docker.pkg.dev/mineral-brand-515105-e3/backend-images/backend-infra-testing:$SHORT_SHA
      - .

options:
  logging: CLOUD_LOGGING_ONLY
