steps:
  - name: node:22-alpine
    id: test
    entrypoint: node
    args: ['--test', 'demo/server.test.mjs']

  - name: docker
    args:
      - buildx
      - create
      - --driver
      - docker-container
      - --name
      - multiarch

  - name: docker
    args:
      - buildx
      - build
      - --builder
      - multiarch
      - --platform
      - linux/amd64,linux/arm64
      - --push
      - -t
      - asia-northeast3-docker.pkg.dev/mineral-brand-515105-e3/backend-images/backend-infra-testing:$SHORT_SHA
      - ./demo

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - hello
      - --image=asia-northeast3-docker.pkg.dev/mineral-brand-515105-e3/backend-images/backend-infra-testing:$SHORT_SHA
      - --region=asia-northeast3
      - --project=mineral-brand-515105-e3
      - --quiet

options:
  logging: CLOUD_LOGGING_ONLY
