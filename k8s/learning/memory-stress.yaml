apiVersion: v1
kind: Pod
metadata:
  name: memory-stress
  namespace: default
  labels:
    app: memory-stress
spec:
  containers:
    - name: memory-stress
      image: backend-infra-testing:health-v1
      imagePullPolicy: Never
      command:
        - node
        - -e
      args:
        - |
          const chunks = [];
          setInterval(() => {
            chunks.push(Buffer.alloc(10 * 1024 * 1024, 1));
            console.log(`allocated ${chunks.length * 10} MiB`);
          }, 500);
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
